<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backstage music JSON</title>
</head>
<body>
<pre id="output">{"status":"loading"}</pre>
<script>
  const output = document.querySelector("#output");

  async function loadTracks() {
    try {
      const response = await fetch("./tracks.json", { cache: "no-store" });
      if (!response.ok) throw new Error(`Music list returned ${response.status}`);
      const tracks = await response.json();
      output.textContent = JSON.stringify(tracks, null, 2);
    } catch (error) {
      output.textContent = JSON.stringify({ error: error.message }, null, 2);
    }
  }

  loadTracks();
</script>
</body>
</html>
