<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Backstage music JSON</title>
</head>
<body>
<pre id="output">{"status":"loading"}</pre>
<script>
  const siteRoot = "https://funkinbackstage.net/";
  const output = document.querySelector("#output");
  const trackPattern = /\{\s*title:\s*("(?:\\.|[^"\\])*")\s*,\s*artist:\s*("(?:\\.|[^"\\])*")\s*,\s*src:\s*("(?:\\.|[^"\\])*")\s*\}/g;

  async function loadTracks() {
    try {
      const pageResponse = await fetch(siteRoot, { cache: "no-store" });
      if (!pageResponse.ok) throw new Error(`Site page returned ${pageResponse.status}`);

      const page = new DOMParser().parseFromString(await pageResponse.text(), "text/html");
      const bundlePath = [...page.scripts]
        .map(script => script.getAttribute("src"))
        .find(src => src && /\/assets\/index-[^/]+\.js(?:\?.*)?$/.test(src));
      if (!bundlePath) throw new Error("Couldn't find the current site bundle.");

      const bundleResponse = await fetch(new URL(bundlePath, siteRoot), { cache: "no-store" });
      if (!bundleResponse.ok) throw new Error(`Player bundle returned ${bundleResponse.status}`);
      const bundle = await bundleResponse.text();

      const tracks = [];
      for (const match of bundle.matchAll(trackPattern)) {
        const title = JSON.parse(match[1]);
        const artist = JSON.parse(match[2]);
        const src = JSON.parse(match[3]);
        if (src.startsWith("/music/") && src.toLowerCase().endsWith(".mp3")) {
          tracks.push({ title, artist, url: new URL(src, siteRoot).href });
        }
      }

      if (!tracks.length) throw new Error("No music tracks found in the current bundle.");
      output.textContent = JSON.stringify(tracks, null, 2);
    } catch (error) {
      output.textContent = JSON.stringify({ error: error.message }, null, 2);
    }
  }

  loadTracks();
</script>
</body>
</html>
